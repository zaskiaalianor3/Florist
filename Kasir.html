<div id="tab-content-kasir" class="hidden space-y-6">
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex justify-between items-center">
        <div>
            <h2 class="text-xl font-bold text-gray-900">Kasir Point of Sales (POS)</h2>
            <p class="text-xs text-gray-400 mt-0.5">Pilih produk bunga dan proses pembayaran pelanggan</p>
        </div>
        <div class="text-sm font-semibold text-emerald-700 bg-emerald-50 px-4 py-2 rounded-xl">
            Kasir Aktif: Indah Permata
        </div>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Katalog Produk Kasir -->
        <div class="lg:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
            <h3 class="font-bold text-gray-900 mb-4">Pilih Produk Bunga</h3>
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
                <div onclick="addToCart('Buket Mawar Holland', 175000)" class="p-4 rounded-xl border border-gray-200 hover:border-emerald-500 cursor-pointer transition text-center group">
                    <span class="text-3xl mb-2 block">🌹</span>
                    <h4 class="font-semibold text-xs text-gray-800 group-hover:text-emerald-700">Buket Mawar Holland</h4>
                    <p class="text-xs text-emerald-600 font-bold mt-1">Rp 175.000</p>
                </div>
                <div onclick="addToCart('Bunga Meja Casablanca', 220000)" class="p-4 rounded-xl border border-gray-200 hover:border-emerald-500 cursor-pointer transition text-center group">
                    <span class="text-3xl mb-2 block">🤍</span>
                    <h4 class="font-semibold text-xs text-gray-800 group-hover:text-emerald-700">Bunga Meja Casablanca</h4>
                    <p class="text-xs text-emerald-600 font-bold mt-1">Rp 220.000</p>
                </div>
            </div>
        </div>
        <!-- Ringkasan Keranjang / Pesanan -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-between">
            <div>
                <h3 class="font-bold text-gray-900 mb-4">Keranjang Belanja</h3>
                <div id="cart-items" class="space-y-3 text-xs text-gray-500 mb-4">
                    <p>Belum ada produk dipilih.</p>
                </div>
            </div>
            <div class="border-t border-gray-100 pt-4">
                <div class="flex justify-between font-bold text-gray-900 text-sm mb-4">
                    <span>Total:</span>
                    <span id="cart-total">Rp 0</span>
                </div>
                <button onclick="checkout()" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white py-3 rounded-xl font-semibold text-xs shadow-md transition">
                    Bayar Sekarang (QRIS / Tunai)
                </button>
            </div>
        </div>
    </div>
</div>
