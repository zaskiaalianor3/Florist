<div id="login-page" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-pink-50 via-white to-emerald-50 px-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-gray-100">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-pink-100 rounded-full flex items-center justify-center mx-auto mb-4 shadow-inner">
                <span class="text-3xl">🌸</span>
            </div>
            <h2 class="text-2xl font-bold text-gray-900">Keisha Florist</h2>
            <p class="text-sm text-gray-500 mt-1">Silakan masuk ke sistem POS & Inventori</p>
        </div>

        <form id="login-form" onsubmit="handleLogin(event)" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email / ID Karyawan</label>
                <input type="text" id="login-user" required 
                    class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition text-sm"
                    placeholder="Contoh: indah / owner">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Kata Sandi</label>
                <input type="password" id="login-pass" required 
                    class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition text-sm"
                    placeholder="••••••••">
            </div>

            <div class="flex items-center justify-between text-sm">
                <label class="flex items-center">
                    <input type="checkbox" class="rounded border-gray-300 text-emerald-600 focus:ring-emerald-500">
                    <span class="ml-2 text-gray-600">Ingat saya</span>
                </label>
                <a href="#" class="text-emerald-600 hover:underline font-medium">Lupa sandi?</a>
            </div>

            <button type="submit" 
                class="w-full py-3 px-4 bg-emerald-700 hover:bg-emerald-800 text-white font-semibold rounded-xl shadow-lg shadow-emerald-600/20 transition duration-200">
                Masuk ke Sistem
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-gray-400">
            &copy; 2026 Keisha Florist Management System
        </div>
    </div>
</div>
